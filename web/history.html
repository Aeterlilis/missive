<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="icon.png" />
  <title>Missive · 历史记录</title>
  <link rel="stylesheet" href="chrome-theme.css" />
  <link rel="stylesheet" href="paper-theme.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <!-- 玻璃折射滤镜（增强玻璃效果用），本身不可见，backdrop-filter: url(#glass-distortion) 引用它 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <!-- 纸张主题背景画在这一层（position:fixed，见 settings.css），列表变长的时候
       它不跟着动，不会出现背景被拉伸的错觉 -->
  <div id="bg-fixed"></div>
  <div class="wrap">
    <header>
      <a class="icon-btn" href="index.html" title="返回日记" aria-label="返回日记"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 6 10l6 6"/></svg></a>
      <h1>历史记录</h1>
    </header>

    <p class="hint" id="emptyHint" style="display:none">还没有写过东西，写完第一页之后会出现在这里。</p>
    <div id="list"></div>
  </div>

  <script type="module" src="src/history.js"></script>
</body>
</html>
