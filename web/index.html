<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Missive</title>
  <link rel="stylesheet" href="chrome-theme.css" />
  <link rel="stylesheet" href="paper-theme.css" />
  <link rel="stylesheet" href="color-picker.css" />
  <link rel="stylesheet" href="range-slider.css" />
  <link rel="stylesheet" href="styles.css" />
  <!-- 必须排最后：里面那条 backdrop-filter 要盖掉上面各文件里的同名声明，见 glass.css -->
  <link rel="stylesheet" href="glass.css" />
</head>
<!-- toolbar-left 是工具栏位置的默认值，写在这儿是为了设置还没拉到时也有个正确的摆法（见 app.js 的 applyToolbarPosition） -->
<body class="toolbar-left">
  <!-- 底层：导入图片时的背景层（用户笔迹画在它上面的 #paper，互不干扰） -->
  <canvas id="bg-layer"></canvas>
  <!-- 全屏画布：用户笔迹 + AI 手写都画在这里 -->
  <canvas id="paper"></canvas>

  <!-- 首屏提示语：图标 + 提示语一组，垂直居中。写第一笔时整组淡出（#hint.fade）。
       提示语不是 DOM 文字而是画在 canvas 上的——它走 scribe，跟 AI 回复用同一套
       手写动画一笔笔浮现，两处的字才能长得一样。
       图标可以戳，戳一下播一遍动画并换一条提示语，见 appicon.js / pokelines.js。 -->
  <div id="hint">
    <!-- 可点区域只有图标本身那么大。画布比它大一圈（抬笔时羽毛要伸出去），那圈是
         透明的，不该抢走纸上的落笔——图标正压在纸中央，用户很可能就从那儿起笔。 -->
    <div id="hint-icon-hit" role="button" tabindex="0" aria-label="戳一下">
      <canvas id="hint-icon"></canvas>
    </div>
    <!-- 外层定高并裁切，内层画布按最多两行准备；写完之后把实际那几行在框里居中。
         这样一行和两行的提示语都不会把上面的图标顶得上下乱跳。 -->
    <div id="hint-text-wrap"><canvas id="hint-text"></canvas></div>
  </div>

  <!-- 等 AI 回答时的指示：同一个图标，小一号，循环播"写一遍再抹掉"。
       这段等待原本是完全空白的，分不清是在想还是出错了。 -->
  <canvas id="thinking-icon"></canvas>

  <!-- 短提示：重置对话这类没有画面变化的操作用它回执一下，自己淡出 -->
  <div id="toast" class="hidden"></div>

  <!-- 重置对话 / 历史记录 / 设置 入口：右上角常驻 -->
  <button type="button" id="btn-reset-context" class="icon-btn" title="重置对话" aria-label="重置对话"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6.5A6.5 6.5 0 1 0 16.5 12"/><path d="M16.5 3v4h-4"/></svg></button>
  <a id="history-link" class="icon-btn" href="history.html" title="历史记录" aria-label="历史记录"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 5c-1.5-1-3.5-1.5-6-1.2v10.7c2.5-.3 4.5.2 6 1.2 1.5-1 3.5-1.5 6-1.2V3.8c-2.5-.3-4.5.2-6 1.2Z"/><path d="M10 5v10.7" stroke-linecap="round"/></svg></a>
  <a id="settings-link" class="icon-btn" href="settings.html" title="设置" aria-label="设置"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h2.6M10.4 6h6.6"/><path d="M3 14h7.6M15.4 14h1.6"/><circle cx="8" cy="6" r="2.2"/><circle cx="13" cy="14" r="2.2"/></svg></a>

  <!-- 写字工具栏：只在 LISTENING（还没提交这一页）时显示。顺序：图片/移除图片/键盘/笔/撤销/清空/发送 -->
  <div id="toolbar">
    <button type="button" id="btn-import" class="icon-btn" title="导入图片"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5"/><circle cx="7" cy="8" r="1.4" fill="currentColor" stroke="none"/><path d="M3 14.5 8 10l3 3 2.5-2.5L17 14" stroke-linecap="round"/></svg></button>
    <button type="button" id="btn-clear-bg" class="icon-btn hidden" title="移除导入的图片"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5"/><path d="M3 14.5 8 10l3 3 2.5-2.5L17 14" stroke-linecap="round"/><path d="M3 3l14 14" stroke-linecap="round"/></svg></button>
    <button type="button" id="btn-type" class="icon-btn" title="切换打字模式"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="5.5" width="15" height="9" rx="1.5"/><path d="M5 9h.01M8 9h.01M11 9h.01M14 9h.01M5.5 12h9" stroke-linecap="round"/></svg></button>
    <button type="button" id="btn-brush" class="icon-btn" title="笔刷"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1-4L13 4l3 3-8 8-4 1Z"/><path d="M11 6l3 3"/></svg></button>
    <button type="button" id="btn-undo" class="icon-btn" title="撤销上一笔"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h9a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" id="btn-clear-all" class="icon-btn" title="清空这一页"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5h13"/><path d="M6 12.5 12.5 6l3 3L9 15.5H6v-3Z"/></svg></button>
    <button type="button" id="btn-send" class="icon-btn" title="发送"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></button>
  </div>
  <input type="file" id="import-file" accept="image/*" style="display:none" />

  <!-- 笔刷面板：点🖊展开，写字页面内直接调 -->
  <div id="brush-panel" class="hidden">
    <div class="brush-presets">
      <button type="button" data-preset="pen">钢笔</button>
      <button type="button" data-preset="ballpoint">圆珠笔</button>
      <button type="button" data-preset="marker">马克笔</button>
      <button type="button" data-preset="brush">毛笔</button>
      <button type="button" data-preset="flat">平笔</button>
      <button type="button" data-preset="pointed">尖笔</button>
    </div>
    <div class="brush-controls">
      <div class="color-presets">
        <button type="button" class="color-swatch" data-color="#000000" title="曜石黑" style="background:#000000"></button>
        <button type="button" class="color-swatch" data-color="#1d2951" title="藏青" style="background:#1d2951"></button>
        <button type="button" class="color-swatch" data-color="#5c3a21" title="赭石" style="background:#5c3a21"></button>
        <button type="button" class="color-swatch" data-color="#9b2f2f" title="朱砂" style="background:#9b2f2f"></button>
        <button type="button" class="color-swatch" data-color="#1f4d3a" title="墨绿" style="background:#1f4d3a"></button>
        <button type="button" id="btn-custom-color" class="color-swatch color-swatch-custom" title="自定义颜色"></button>
      </div>
      <input type="range" id="brush-size-picker" min="2" max="30" step="1" title="粗细" />
      <!-- 笔尖角度：只有平笔是凿尖的，笔尖有朝向可言；其余笔刷是圆头，转了没有区别。
           所以它跟着当前笔刷显隐，见 syncBrushUI。
           必须跟粗细滑块一样直接挂在 .brush-controls 下——这里的宽度靠 align-items:stretch
           撑开，多包一层容器滑块宽度就塌成 0，手柄会一直贴在最左边。 -->
      <input type="range" id="brush-angle-picker" min="0" max="180" step="1" title="笔尖角度" />
    </div>
    <div id="color-panel" class="color-picker-panel hidden">
      <div class="color-mode-tabs">
        <button type="button" class="color-mode-tab active" data-mode="square">HSB</button>
        <button type="button" class="color-mode-tab" data-mode="wheel">色环</button>
      </div>
      <div id="color-mode-square" class="color-mode-square">
        <canvas id="color-sv" width="160" height="90"></canvas>
        <canvas id="color-hue" width="160" height="14"></canvas>
      </div>
      <canvas id="color-wheel" width="160" height="160" class="color-wheel hidden"></canvas>
      <div class="color-panel-row">
        <span id="color-preview" class="color-swatch"></span>
        <input type="text" id="color-hex" class="color-hex-input" maxlength="7" spellcheck="false" />
      </div>
    </div>
  </div>

  <!-- 通用确认框：清空笔迹、重置对话都用它，问题和按钮由 app.js 的 showConfirm 填。
       贴着触发它的那个按钮弹出（at-toolbar 贴工具栏、at-topright 贴右上角那组，
       见 styles.css），点框以外任何地方都算取消。 -->
  <div id="confirm-box" class="hidden">
    <p id="confirm-text"></p>
    <div class="confirm-actions" id="confirm-actions"></div>
  </div>

  <!-- 行内打字框：就摆在正文将来浮现的那块位置上，点确定之后这段字会在原地
       一笔笔写出来，再被纸吸掉，然后才轮到 AI 回复（见 app.js 的 submitTyped）。 -->
  <div id="type-box" class="hidden">
    <textarea id="type-input" rows="1" placeholder="打字代替写字…"></textarea>
    <div class="type-actions">
      <button type="button" id="type-cancel">返回写字</button>
      <button type="button" id="type-send">确定</button>
    </div>
  </div>

  <!-- 调试浮层 -->
  <pre id="debug"></pre>

  <!-- 霞鹜文楷：中文手写体字体 -->
  <style>
    @font-face {
      font-family: "LXGW WenKai";
      src: url("fonts/LXGWWenKai.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Pinyon Script：花体连笔（可在设置里选） */
    @font-face {
      font-family: "Pinyon Script";
      src: url("fonts/PinyonScript.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* MedievalSharp：西幻哥特体（可在设置里选） */
    @font-face {
      font-family: "MedievalSharp";
      src: url("fonts/MedievalSharp.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Manufacturing Consent：油墨印章体（可在设置里选） */
    @font-face {
      font-family: "Manufacturing Consent";
      src: url("fonts/ManufacturingConsent.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Monsieur La Doulaise：华丽花体（可在设置里选） */
    @font-face {
      font-family: "Monsieur La Doulaise";
      src: url("fonts/MonsieurLaDoulaise.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* My Soul：俏皮手写体（可在设置里选） */
    @font-face {
      font-family: "My Soul";
      src: url("fonts/MySoul.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Liu Jian Mao Cao：中文草书连笔（可在设置里选） */
    @font-face {
      font-family: "Liu Jian Mao Cao";
      src: url("fonts/LiuJianMaoCao.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Zhi Mang Xing：中文行书体（可在设置里选） */
    @font-face {
      font-family: "Zhi Mang Xing";
      src: url("fonts/ZhiMangXing.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Noto Serif SC：宋体印刷体，不是手写风格（可在设置里选） */
    @font-face {
      font-family: "Noto Serif SC";
      src: url("fonts/NotoSerifSC.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* 寒蝉书体·春风：清秀楷书，基于"演示春风楷"扩展，SIL OFL 协议（可在设置里选） */
    @font-face {
      font-family: "Chill ChunFeng";
      src: url("fonts/ChillChunFeng.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <!-- 模块以 ESM 加载，app.js 是主入口。?v= 强制刷新缓存 -->
  <script type="module" src="src/app.js?v=35"></script>
</body>
</html>
